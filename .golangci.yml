version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec
    - goconst
    - gocyclo
  exclusions:
    rules:
      # Repeated values are intentional table-test inputs; still flag literals
      # when a production constant already exists.
      - path: _test\.go
        text: make it a constant
        linters:
          - goconst
run:
  timeout: 5m
